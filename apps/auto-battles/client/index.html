<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="auto-battles" />
    <title>auto-battles</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #1a1a2e;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas { display: block; }

      #rotate-prompt {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        background: #1a1a2e;
        color: #ffffff;
        font-family: monospace;
        font-size: 1.1rem;
        text-align: center;
        padding: 1.5rem;
        z-index: 100;
      }
      #rotate-prompt .icon {
        font-size: 3rem;
        animation: rotate-hint 1.6s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%, 100% { transform: rotate(0deg); }
        50%      { transform: rotate(90deg); }
      }
      /* Show the rotate prompt only on portrait phones, not on portrait
         desktops where the user can't rotate anything. */
      @media (orientation: portrait) and (pointer: coarse) and (max-width: 900px) {
        #rotate-prompt { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="rotate-prompt">
      <div class="icon">&#x21BB;</div>
      <div>Rotate your device to landscape</div>
      <div style="font-size: 0.8rem; opacity: 0.7;">Tap to enter fullscreen</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
