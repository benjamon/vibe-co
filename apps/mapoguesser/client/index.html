<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mapoguesser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body { background: #000; font-family: 'Fredoka', system-ui, sans-serif; }

      /* Pressable arcade-sticker buttons: depress on tap/click. Combined
         with the inline hard-shadow/border styling from theme.ts. */
      .arcade-btn {
        transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .arcade-btn:active:not(:disabled) {
        transform: translate(3px, 3px) !important;
        box-shadow: 0px 0px 0px #4A3826 !important;
      }

      /* MapLibre defaults to an open-hand "grab" cursor any time the map is
         interactive, but this is a click-to-place-a-guess game, not a
         drag-to-explore map — a plain pointer reads better at rest. Its
         built-in :active (mouse held / touch drag in progress) rule already
         swaps to "grabbing"; only the resting cursor is overridden here.
         !important is needed regardless of stylesheet load order, since
         maplibre-gl.css is injected later, into the same specificity tier. */
      .maplibregl-canvas-container.maplibregl-interactive {
        cursor: pointer !important;
      }
      .maplibregl-canvas-container.maplibregl-interactive:active {
        cursor: grabbing !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
