name: Deploy apps to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install auto-battles
        working-directory: apps/auto-battles
        run: npm ci

      - name: Build auto-battles
        working-directory: apps/auto-battles
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/auto-battles/
        run: npm run build

      - name: Install coin-flip
        working-directory: apps/coin-flip
        run: npm ci

      - name: Build coin-flip
        working-directory: apps/coin-flip
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/coin-flip/
        run: npm run build

      - name: Install mapoguesser
        working-directory: apps/mapoguesser
        run: npm ci

      - name: Build mapoguesser
        working-directory: apps/mapoguesser
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/mapoguesser/
        run: npm run build

      - name: Install sky-strike
        working-directory: apps/sky-strike
        run: npm ci

      - name: Build sky-strike
        working-directory: apps/sky-strike
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/sky-strike/
        run: npm run build

      - name: Install osm_globe
        working-directory: apps/osm_globe
        run: npm ci

      - name: Build osm_globe
        working-directory: apps/osm_globe
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/osm_globe/
        run: npm run build

      - name: Stage site
        run: |
          mkdir -p _site/auto-battles _site/coin-flip _site/mapoguesser _site/sky-strike _site/osm_globe _site/hub
          cp -r apps/auto-battles/client/dist/. _site/auto-battles/
          cp apps/auto-battles/client/dist/index.html _site/auto-battles/404.html
          cp -r apps/coin-flip/client/dist/. _site/coin-flip/
          cp apps/coin-flip/client/dist/index.html _site/coin-flip/404.html
          cp -r apps/mapoguesser/client/dist/. _site/mapoguesser/
          cp apps/mapoguesser/client/dist/index.html _site/mapoguesser/404.html
          cp -r apps/sky-strike/client/dist/. _site/sky-strike/
          cp apps/sky-strike/client/dist/index.html _site/sky-strike/404.html
          cp -r apps/osm_globe/client/dist/. _site/osm_globe/
          cp apps/osm_globe/client/dist/index.html _site/osm_globe/404.html
          cp -r apps/hub/. _site/hub/
          cp apps/hub/index.html _site/hub/404.html
          cp site/index.html _site/index.html
          echo '--- artifact tree ---'
          find _site -maxdepth 3 -print

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
